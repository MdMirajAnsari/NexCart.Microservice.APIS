<div class="auth-container">
  <div class="auth-card">
    <h2>Register</h2>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    @if (success()) {
      <div class="success">{{ success() }}</div>
    }

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label>Email:</label>
        <input
          type="email"
          [ngModel]="registerRequest().email"
          (ngModelChange)="updateRegisterEmail($event)"
          name="email"
          class="form-control"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label>Password:</label>
        <input
          type="password"
          [ngModel]="registerRequest().password"
          (ngModelChange)="updateRegisterPassword($event)"
          name="password"
          class="form-control"
          placeholder="Enter your password"
          required
        />
      </div>

      <div class="form-group">
        <label>Full Name:</label>
        <input
          type="text"
          [ngModel]="registerRequest().personName"
          (ngModelChange)="updatePersonName($event)"
          name="personName"
          class="form-control"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="form-group">
        <label>Gender:</label>
        <select [ngModel]="registerRequest().gender" (ngModelChange)="updateGender($event)" name="gender" class="form-control" required>
          @for (gender of genders; track gender) {
            <option [value]="gender">{{ gender }}</option>
          }
        </select>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) { Registering... } @else { Register }
      </button>
    </form>

    <p class="auth-link">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </div>
</div>
